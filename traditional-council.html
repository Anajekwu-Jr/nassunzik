<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=0.3">
  <script>
    (function() {
      function fitDesktopViewport() {
        var sw = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
        var vp = document.querySelector('meta[name="viewport"]');
        if (!vp) {
          vp = document.createElement('meta');
          vp.name = 'viewport';
          document.head.appendChild(vp);
        }
        if (sw < 1280) {
          var scale = (sw / 1280).toFixed(4);
          vp.setAttribute('content', 'width=1280, initial-scale=' + scale);
        } else {
          vp.setAttribute('content', 'width=1280, initial-scale=1.0');
        }
      }
      fitDesktopViewport();
      window.addEventListener('DOMContentLoaded', fitDesktopViewport);
      window.addEventListener('resize', fitDesktopViewport);
      window.addEventListener('orientationchange', fitDesktopViewport);
    })();
  </script>
  <title>NASS Traditional Council · Nzenaozo Royal Family</title>
