<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    (function() {
      function forceMobileResolution() {
        var smallest = Math.min(window.screen.width, window.screen.height);
        var ua = navigator.userAgent || '';
        var isMobile = smallest <= 600 || /Android|iPhone|iPod|iPad/i.test(ua);
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.name = 'viewport';
          document.head.appendChild(meta);
        }
        if (isMobile) {
          var targetW = (smallest >= 320 && smallest <= 480) ? smallest : 412;
          meta.setAttribute('content', 'width=' + targetW + ', initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        } else {
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
      }
      forceMobileResolution();
      window.addEventListener('resize', forceMobileResolution);
      window.addEventListener('orientationchange', forceMobileResolution);
    })();
  </script>
  <title>NASS Departmental Mobile Application</title>
  <meta name="description" content="Official student mobile application for the National Association Of Statistics Students (NASS), Department of Statistics, Nnamdi Azikiwe University (UNIZIK).">
  <meta property="og:title" content="NASS UNIZIK Mobile App">
  <meta property="og:description" content="Official student mobile application for the National Association Of Statistics Students (NASS), Department of Statistics, Nnamdi Azikiwe University (UNIZIK).">

  <!-- Progressive Web App / Mobile Status Bar Meta -->
  <meta name="theme-color" content="#0c2340">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stats UNIZIK">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/jpeg" href="/resources/images/nass-logo.jpg">
  
  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

</head>
