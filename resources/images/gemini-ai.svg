<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="navyGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#163e6e" />
      <stop offset="100%" stop-color="#071526" />
    </radialGradient>
    <linearGradient id="geminiSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" fill="url(#navyGlow)" />
  <rect x="6" y="6" width="244" height="244" rx="28" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.75" />

  <!-- Subtle Coordinate / Statistical Grid Lines -->
  <path d="M128 32 L128 224 M32 128 L224 128" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 4" />
  <circle cx="128" cy="128" r="84" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 4" />

  <!-- Department Arch Banner Subtitle -->
  <text x="128" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fef3c7" letter-spacing="2" text-anchor="middle">UNIZIK · STATISTICS</text>

  <!-- Central Gemini Star (Curved Diamond Star) -->
  <path d="M128 58 C128 96.66 96.66 128 58 128 C96.66 128 128 159.34 128 198 C128 159.34 159.34 128 198 128 C159.34 128 128 96.66 128 58 Z" fill="url(#geminiSpark)" />
  
  <!-- Inner Highlight Star -->
  <path d="M128 82 C128 107.4 107.4 128 82 128 C107.4 128 128 148.6 128 174 C128 148.6 148.6 128 174 128 C148.6 128 128 107.4 128 82 Z" fill="url(#innerGlow)" opacity="0.65" />

  <!-- Small Auxiliary Accent Star -->
  <path d="M182 72 C182 81 173 90 164 90 C173 90 182 99 182 108 C182 99 191 90 200 90 C191 90 182 81 182 72 Z" fill="#67e8f9" opacity="0.85" />

  <!-- Bottom Brand Text -->
  <text x="128" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#f59e0b" letter-spacing="3" text-anchor="middle">GEMINI AI</text>
</svg>
